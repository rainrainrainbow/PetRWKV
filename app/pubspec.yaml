name: zone
description: "PetRWKV - 本地智能宠物，可进化的 AI 伙伴"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.0.0

  # 网络和本地存储
  dio: ^5.9.0
  shared_preferences: ^2.3.0
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # FFI 调用 C++ 引擎
  ffi: ^2.1.0

  # 电池和后台服务
  battery_plus: ^3.0.0
  connectivity_plus: ^6.0.0

  # UI 组件
  cupertino_icons: ^1.0.0
  font_awesome_flutter: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3

  # 动画
  flutter_staggered_grid_view: ^0.7.0

  # 工具
  equatable: ^2.0.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^8.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/animations/

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
