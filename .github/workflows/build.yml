name: Build PetRWKV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: $3.24.5'
          channel: 'stable'
      - name: Setup project
        run: |
          flutter create --platforms=android --org com.petrwkv --project-name zone /tmp/ft_temp
          cp -r /tmp/ft_temp/android app/android
      - name: Install deps
        run: |
          cd app
          flutter pub get
      - name: Build APK |
          cd app
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: pet-rwkv-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 30