name: Build PetRWKV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Setup and build
        run: |
          flutter create --platforms=android --org com.petrwkv --project-name zone /tmp/ft
          cp -r /tmp/ft/android app/
          cd app && flutter pub get && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: pet-jwkv-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
