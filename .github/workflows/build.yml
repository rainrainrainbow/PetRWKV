name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          flutter create pet_rwkv_temp
          cp -r pet_rwkv_temp/android app/
          cp pwd_rwkv_temp/lib/main.dart app/lib/
          rm -rf pet_rwkv_temp

      - name: Setup Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PetRWKV-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
